name: Publish images

# Publishes every image in this repo to GHCR as
# ghcr.io/nexuslbs/omni-images/<name>.
#
# TAG-ONLY, latest + version (operator correction 2026-09-26, telegram threads
# 3165 + 3166): an image is published ONLY when a tag of ITS OWN prefix is
# pushed - `browser-*` publishes the browser image, `workstation-tools-*` the
# workstation-tools image, `minio-*` the minio image. The image version is the
# tag with the prefix stripped (`browser-0.0.4` -> `browser:0.0.4`). EVERY
# published image gets BOTH tags: `latest` (the rolling alias) AND the version
# tag (the immutable ref consumers may pin). There is NO publish on plain `main`
# pushes (the old sha-tag publish on main is gone) and no `workflow_dispatch`.

on:
  push:
    tags:
      - 'browser-*'
      - 'workstation-tools-*'
      - 'workstation-datasci-*'
      - 'workstation-office-*'
      - 'workstation-media-*'
      - 'minio-*'

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: browser
            prefix: browser-
            context: browser
          - image: workstation-tools
            prefix: workstation-tools-
            context: workstation-tools
          - image: workstation-datasci
            prefix: workstation-datasci-
            context: workstation-datasci
          - image: workstation-office
            prefix: workstation-office-
            context: workstation-office
          - image: workstation-media
            prefix: workstation-media-
            context: workstation-media
          - image: minio
            prefix: minio-
            context: minio
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image version is derived from the tag: `browser-0.0.4` -> 0.0.4.
      # Every matrix entry runs on every tag push; entries whose prefix does not
      # match the pushed tag skip (exit 0, nothing to publish for that image).
      - name: Resolve the image version from the tag
        id: version
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          PREFIX="${{ matrix.prefix }}"
          case "$REF" in
            ${PREFIX}*) VERSION="${REF#${PREFIX}}" ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$REF' does not carry a version (expected ${PREFIX}X.Y.Z)"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing ghcr.io/nexuslbs/omni-images/${{ matrix.image }}:${VERSION} and :latest"

      - name: Skip (tag is not for this image)
        if: steps.version.outputs.skip == 'true'
        run: echo "tag ${{ github.ref_name }} is not a ${{ matrix.prefix }} tag; nothing to publish for ${{ matrix.image }}"

      - name: Build the image (no push)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker build -t "${{ matrix.image }}:local" "${{ matrix.context }}"
          docker image inspect --format '{{.Id}} {{.RepoTags}}' "${{ matrix.image }}:local"

      # The image is only worth publishing if the interface it promises really
      # answers: run it and require the interface. A build-only job would publish
      # an image nobody knows is usable.
      - name: Smoke-test the built image (interface must answer)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            browser)
              # CDP endpoint: what the workstation/workbench provider attaches to.
              docker run -d --name smoke -p 9222:9222 "${{ matrix.image }}:local"
              ok=0
              for i in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:9222/json/version > /tmp/version.json 2>/dev/null; then
                  ok=1
                  break
                fi
                sleep 2
              done
              docker logs smoke 2>&1 | tail -n 20 || true
              docker rm -f smoke >/dev/null 2>&1 || true
              test "$ok" = "1" || { echo "::error::the browser image never answered CDP /json/version"; exit 1; }
              grep -q '"Browser"' /tmp/version.json
              echo "OK: browser CDP /json/version answered"
              ;;
            workstation-tools)
              # Tools that RUN AND FINISH, container stays up (sleep infinity).
              docker run -d --name smoke "${{ matrix.image }}:local"
              docker exec smoke himalaya --version
              docker exec smoke sh -c 'for t in himalaya curl wget jq python3 oathtool psql docker sqlite3 yq node; do command -v "$t" || exit 1; done'
              docker exec smoke sh -c 'for t in git mysql redis-cli mongosh zip gitleaks trivy semgrep qpdf pdfinfo; do command -v "$t" || exit 1; done'
              docker exec smoke git --version
              docker exec smoke mysql --version
              docker exec smoke redis-cli --version
              docker exec smoke mongosh --version
              docker exec smoke zip -v
              docker exec smoke gitleaks version
              docker exec smoke trivy --version
              docker exec smoke semgrep --version
              docker exec smoke qpdf --version
              docker exec smoke pdfinfo -v
              docker exec smoke sqlite3 --version
              docker exec smoke yq --version
              docker exec smoke node --version
              docker exec smoke sh -c 'test -f /etc/gitleaks/gitleaks.toml && test -f /etc/gitleaks/gitleaks-defaults.toml'
              # End-to-end gate proof: git-history mode must run (git present)
              # and the shape-based rule must flag the canonical placeholder.
              docker exec smoke sh -c 'set -e; rm -rf /tmp/gate; mkdir -p /tmp/gate; cd /tmp/gate; git init -q; git config user.email ci@example.com; git config user.name ci; printf "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\n" > demo.env; git add demo.env; git commit -qm demo; gitleaks detect --config /etc/gitleaks/gitleaks.toml --source . --log-opts=--all --report-format=json --report-path=/tmp/gate.json --exit-code 0; grep -q aws-access-key-id-strict /tmp/gate.json'
              docker rm -f smoke >/dev/null 2>&1 || true
              echo "OK: workstation-tools ships himalaya + the general tool set + git + mysql/redis-cli/mongosh/zip/gitleaks/trivy/semgrep/qpdf/pdfinfo/sqlite3/yq/node and the gate config answers in git-history mode"
              ;;
            workstation-datasci)
              # The data-science stack must import and jupyter must answer.
              docker run -d --name smoke "${{ matrix.image }}:local"
              docker exec smoke python3 -c "import numpy,pandas,scipy,matplotlib,sklearn; print('ds-ok')"
              docker exec smoke jupyter --version
              docker rm -f smoke >/dev/null 2>&1 || true
              echo "OK: workstation-datasci ships the data-science stack"
              ;;
            workstation-office)
              # Office/OCR/render CLIs + the Python document libraries must answer.
              docker run -d --name smoke "${{ matrix.image }}:local"
              docker exec smoke pandoc --version
              docker exec smoke tesseract --version
              docker exec smoke pdftotext -v
              docker exec smoke python3 -c "import docx,openpyxl,reportlab,pptx,pypdf; print('office-ok')"
              docker exec smoke sh -c 'for t in libreoffice soffice latex pdflatex dot plantuml qpdf gs file; do command -v "$t" || exit 1; done'
              docker exec smoke libreoffice --version
              docker exec smoke latex --version
              docker exec smoke dot -V
              docker exec smoke qpdf --version
              docker exec smoke gs --version
              docker exec smoke plantuml -version
              docker exec smoke file --version
              docker rm -f smoke >/dev/null 2>&1 || true
              echo "OK: workstation-office ships pandoc/tesseract/poppler + the doc libs + libreoffice/texlive/graphviz/qpdf/gs/plantuml/file"
              ;;
            workstation-media)
              # ffmpeg + imagemagick + sox + the faster-whisper import and the
              # `whisper` CLI must answer.
              docker run -d --name smoke "${{ matrix.image }}:local"
              docker exec smoke ffmpeg -version
              docker exec smoke magick -version
              docker exec smoke python3 -c "from faster_whisper import WhisperModel; print('media-ok')"
              docker exec smoke sh -c 'for t in sox whisper ffmpeg magick; do command -v "$t" || exit 1; done'
              docker exec smoke sox --version
              docker exec smoke whisper --help
              docker rm -f smoke >/dev/null 2>&1 || true
              echo "OK: workstation-media ships ffmpeg/imagemagick/sox + faster-whisper + the whisper CLI"
              ;;
            minio)
              # Exactly what docker-compose.minio.yml's healthcheck and
              # deploy.py's readiness probe exec inside the container.
              docker run -d --name smoke \
                -e MINIO_ROOT_USER=smoke -e MINIO_ROOT_PASSWORD=smokepassword \
                -p 127.0.0.1:9000:9000 "${{ matrix.image }}:local"
              ok=0
              for i in $(seq 1 30); do
                if docker exec smoke curl -sf http://localhost:9000/minio/health/live >/dev/null; then
                  ok=1
                  break
                fi
                sleep 2
              done
              docker logs smoke 2>&1 | tail -20 || true
              docker rm -f smoke >/dev/null 2>&1 || true
              test "$ok" = "1" || { echo "::error::minio never answered /minio/health/live"; exit 1; }
              echo "OK: minio /minio/health/live answered"
              ;;
          esac

      - name: Log in to GHCR
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the SAME tested image under BOTH tags: `latest` (rolling alias) and
      # the version tag (immutable ref consumers may pin).
      - name: Tag and push :version + :latest
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/nexuslbs/omni-images/${{ matrix.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          docker tag "${{ matrix.image }}:local" "$IMAGE:$VERSION"
          docker tag "${{ matrix.image }}:local" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION"
          {
            echo "### ${{ matrix.image }} image published"
            echo ""
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # HARD GATE - the upstream contract consumers depend on: the published
      # image must be pullable with NO credentials.
      - name: Verify credential-less pull (latest + version)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/nexuslbs/omni-images/${{ matrix.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          docker logout ghcr.io 2>/dev/null || true
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if grep -q 'ghcr.io' "$cfg" 2>/dev/null; then
            echo "::error::ghcr.io credentials present in $cfg - an anonymous pull would not be proven" >&2
            cat "$cfg" >&2
            exit 1
          fi
          docker pull "$IMAGE:$VERSION"
          docker pull "$IMAGE:latest"
          echo "== anonymous pull OK =="
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION"